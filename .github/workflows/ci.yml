name: DotaRise checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dotarise
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: dotarise
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dotarise -d dotarise"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dotarise:ci-password@localhost:5432/dotarise
      RUN_POSTGRES_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: backend/requirements-lock.txt }
      - run: pip install -r backend/requirements-lock.txt
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m alembic check
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium --only-shell
        working-directory: frontend
      - run: npm run test:e2e -- --workers=2
        working-directory: frontend
  container:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dotarise
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: dotarise
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dotarise -d dotarise"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://dotarise:ci-password@localhost:5432/dotarise
      ENVIRONMENT: production
      FRONTEND_URL: https://dotarise.example
      BACKEND_URL: https://dotarise.example
      CORS_ORIGINS: '["https://dotarise.example"]'
      COOKIE_SECURE: 'true'
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t dotarise-check .
      - run: docker build -f backend/Dockerfile -t dotarise-api-check .
      - run: docker run --rm --network host -e DATABASE_URL dotarise-check python -m alembic upgrade head
      - run: >-
          docker run -d --name dotarise-check --network host
          -e DATABASE_URL -e ENVIRONMENT -e FRONTEND_URL -e BACKEND_URL
          -e CORS_ORIGINS -e COOKIE_SECURE -e PORT=8080 dotarise-check
      - run: curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8080/api/health
      - run: curl --fail -H 'Accept:text/html' http://localhost:8080/dashboard
      - run: docker logs dotarise-check
        if: always()
